# test fixture: two area pages and a hub with one subpage; the power key cycles (page:cycle), autolock after 10 s
ui version=1 title=cycle autolock=10
on key=short page:cycle
on key=long page:system
page id=a title="Area A" grid=2x1
entity at=0,0 slot=office_amb tap=toggle
page id=b title="Area B" grid=2x1
entity at=0,0 slot=office_hue1 tap=toggle
page id=system title=System hub=1 grid=3x2
button at=1,0 label=Sub icon=cog action=page arg=sub
page id=sub title=Sub grid=1x1 hidden=1 parent=system
label at=0,0 text="Čevapčiči, Größe, Ångström, Đurđevac: 21,5 °C ± 0,5 · 12 µg/m³ …"
