# test fixture: HA widgets on a page with the nav bar (4x3 cells of 110 x 48 px), a tile/bar/gauge/row on ha.* keys,
# a button with action=ha, a hidden page reached by an entity tap
ui version=1 title=homtom start=ha

page id=ha title=HA grid=4x3
entity at=0,0 slot=office_amb icon=bulb tap=ha:toggle hold=page:light
entity at=1,0 slot=office_hue2 icon=bulb tap=ha:toggle hold=page:light
entity at=2,0 slot=office_co2 icon=co2 high=1000
entity at=3,0 slot=office_presence icon=person
entity at=0,1 slot=office_clim icon=fire tap=page:climate
entity at=1,1 slot=office_ac icon=power tap=ha:toggle confirm=1 label="AC power"
entity at=2,1 slot=nothing icon=drop
entity at=3,1 slot=office_dead icon=bulb tap=ha:toggle
button at=0,2 label="All off" action=ha slot=office_all arg=set_bri:0
button at=1,2 label=Scene action=ha slot=office_scene arg=press
button at=2,2 label=Cool action=ha slot=office_clim arg=mode:cool
button at=3,2 label=Warm action=ha slot=office_hue1 arg=set_ct:2700

page id=keys title=Keys grid=3x2
tile at=0,0 label=AMBIENT key=ha.office_amb.state fmt=onoff colorkey=ha.office_amb.on good=1
bar at=1,0 label=BRIGHTNESS key=ha.office_amb.bri unit=" %"
gauge at=2,0 span=1,2 label=CO2 key=ha.office_co2.val max=2000 unit=" ppm" high=1000
list at=0,1 span=2,1 label=CLIMATE
row label=Target key=ha.office_clim.target unit=" C"
row label="CO2 age" key=ha.office_co2.age unit=" s"

page id=light title=Light grid=1x1 hidden=1
lightctl at=0,0 slot=*

page id=climate title=Climate grid=1x1 hidden=1
thermo at=0,0 slot=*
