# test fixture: the example output of tools/homtom-ha-ui-gen.py (docs/HA_UI_BRIDGE.md, "Generated ui.conf"), verbatim
# apart from this comment, plus a second area page so nav=both has two tabs and dots
ui version=1 title=homtom start=office nav=both
page id=office title=Office grid=4x3
lightctl at=0,0 span=2,1 slot=office_all label="All lights" ct_min=2000 ct_max=6500 color=1 detail=office_l1
thermo at=2,0 span=2,1 slot=office_thermo label=Heating min=10 max=26 step=0.5 modes=off,heat
entity at=0,1 slot=office_presence label=Presence
entity at=1,1 slot=office_co2 label=CO2 good_below=1000
entity at=1,2 slot=office_ac_pwr label="Vent on/off" tap=press confirm=1
page id=office_l1 title=Ambient grid=1x1 hidden=1 group=office_lights parent=office
lightctl at=0,0 slot=office_amb label=Ambient color=0
page id=office_l2 title="Hue 1" grid=1x1 hidden=1 group=office_lights parent=office
lightctl at=0,0 slot=office_hue1 label="Hue 1" ct_min=2200 ct_max=6500 color=1
page id=kitchen title=Kitchen grid=4x3
entity at=0,0 slot=kitchen_a1 label=Kitchen tap=toggle
