# homtom ui.conf: Home Assistant office page (format: docs/UI_CONFIG.md, HA keys and actions: docs/HA_UI.md).
# Values come from /tmp/ha.states (written by the Mac); taps and long presses append event=ha lines to /tmp/ui.events.
# Layout as docs/ui-mockups/office.png: four tiles, a sensor strip (read-only entities side by side share one card),
# the thermostat card on the right. tests/run.sh also renders this file merged with the base config (conf/full.conf).
ui version=1 title=Office start=office

page id=office title=Office
# lights: tap toggles, long press opens that light's page
entity x=8 y=40 w=146 h=76 slot=office_amb icon=bulb tap=ha:toggle hold=page:light_amb
entity x=162 y=40 w=146 h=76 slot=office_hue1 icon=bulb tap=ha:toggle hold=page:light_hue1
entity x=8 y=124 w=146 h=76 slot=office_hue2 icon=bulb tap=ha:toggle hold=page:light_hue2
# ventilation: IR buttons without state. Tap sends on/off, a long press opens its three buttons
entity x=162 y=124 w=146 h=76 slot=vent_onoff label=Vent icon=fan tap=ha:press hold=page:office_vent
# sensors: display only; CO2 turns red at 1400 ppm
entity x=8 y=208 w=100 h=40 slot=office_presence icon=presence
entity x=108 y=208 w=100 h=40 slot=office_co2 icon=co2 high=1400
entity x=208 y=208 w=100 h=40 slot=office_temp icon=thermometer
thermo x=316 y=40 w=156 h=208 slot=office_clim modes=heat,cool,off

# light pages: one per light; same group = swipe left/right between them, Back returns to the parent
page id=light_amb title=Ambient grid=1x1 hidden=1 group=office_lights parent=office
lightctl at=0,0 slot=office_amb
page id=light_hue1 title="Hue 1" grid=1x1 hidden=1 group=office_lights parent=office
lightctl at=0,0 slot=office_hue1
page id=light_hue2 title="Hue 2" grid=1x1 hidden=1 group=office_lights parent=office
lightctl at=0,0 slot=office_hue2
page id=light_desk title=Desk grid=1x1 hidden=1 group=office_lights parent=office
lightctl at=0,0 slot=office_desk dim=1
page id=light_all title="All lights" grid=1x1 hidden=1 group=office_lights parent=office
lightctl at=0,0 slot=office_all

# ventilation page: the three IR buttons
page id=office_vent title=Vent hidden=1 parent=office
button x=8 y=40 w=149 h=120 label="On/off" icon=power action=ha slot=vent_onoff arg=press confirm=1
button x=165 y=40 w=149 h=120 label=High icon=fan action=ha slot=vent_high arg=press
button x=322 y=40 w=150 h=120 label=Low icon=fan action=ha slot=vent_low arg=press
