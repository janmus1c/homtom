# homtom ui.conf: device controls and Home Assistant scene buttons (format: docs/UI_CONFIG.md)
ui version=1 title=homtom start=controls

# power key: short press cycles pages, long press dims the screen
on key=short action=page arg=next
on key=long action=backlight arg=10

page id=controls title=Controls grid=2x2
slider at=0,0 label=Brightness action=backlight min=5 max=100 step=5 unit=" %"
slider at=1,0 label=Volume action=volume min=0 max=100 step=10 unit=" %"
button at=0,1 label=Beep action=beep arg=1000
toggle at=1,1 label=Mute action=mute

page id=scenes title=Scenes grid=3x2
button at=0,0 label="Lights on" action=event arg=lights_on
button at=1,0 label="Lights off" action=event arg=lights_off
button at=2,0 label="Good night" action=event arg=good_night confirm=1
button at=0,1 label=Dim action=backlight arg=20
button at=1,1 label=Bright action=backlight arg=100
toggle at=2,1 label=Away var=away action=event arg=away
