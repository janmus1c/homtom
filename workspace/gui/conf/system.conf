# homtom ui.conf: device status and maintenance (format: docs/UI_CONFIG.md)
ui version=1 title=homtom start=system

page id=system title=System grid=3x2
list at=0,0 span=1,2 label=Device
row label=Uptime key=uptime
row label=Mains key=external_power fmt=yesno good=1
row label=Charging key=charging fmt=yesno good=1
row label="Ambient light" key=light_raw unavailable_below=10
row label=Bluetooth key=bt_up fmt=onoff good=1
row label=Mic key=mic_level unit=" dB"
gauge at=1,0 span=1,2 label=Battery key=battery_pct_est unit="%" low=16
tile at=2,0 label=GPS key=gps.fix colorkey=gps.fixq good=1 color=warn sub=gps.sats subunit=" sats"
button at=2,1 label="Storage mode" action=storage

page id=tools title=Tools grid=3x2
button at=0,0 label="GPS on" action=cmd arg=gps-on
button at=1,0 label="GPS off" action=cmd arg=gps-off confirm=1
button at=2,0 label=Screenshot action=cmd arg=screenshot
button at=0,1 label=Reload action=reload
button at=1,1 label=Ping action=event arg=ping
label at=2,1 key=page font=s color=muted align=center
